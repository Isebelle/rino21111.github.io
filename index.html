<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the beez rooms</title>
<meta property="og:title" content="the beez rooms">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rino21111.github.io/">
<meta name="theme-color" content="#b9a75c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>">
<style>
  :root {
    color-scheme: light;
    --ink: #3b3214;
    --bee-gold: #dcae36;
    --bee-dark: #2a2208;
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: #a59352; }
  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--ink);
    font: 15px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    /* what shows before the room has been drawn (and if scripts are off) */
    background:
      radial-gradient(ellipse 80% 40% at 50% 12%, rgba(240, 232, 190, .5), transparent 70%),
      linear-gradient(#d3c899 0, #c6b67a 30%, #bba45d 48%, #a38e52 68%, #7c6a3c 100%);
    background-attachment: fixed;
  }

  /* ---- the room: drawn once into a canvas, then film grain, lens falloff, hum ---- */
  .room { position: fixed; left: 0; top: 0; width: 100%; height: 100vh; height: 100lvh; pointer-events: none; overflow: hidden; }
  .room canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .9s ease; }
  .room canvas.on { opacity: 1; }
  .film { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .grain { position: absolute; inset: 0; opacity: .2; mix-blend-mode: overlay; background-size: 192px 192px; }
  .falloff {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 75% 70% at 50% 46%, transparent 52%, rgba(34, 26, 4, .38) 100%),
      linear-gradient(transparent 68%, rgba(34, 26, 4, .16));
  }
  /* the fluorescent hum: once in a while the tubes sag for a moment */
  .room .hum { position: absolute; inset: 0; background: #1c1604; opacity: 0; animation: hum 14s infinite; }
  @keyframes hum {
    0%, 81%, 82.6%, 84.4%, 100% { opacity: 0; }
    81.4% { opacity: .07; }
    83.3% { opacity: .1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .room canvas { transition: none; }
    .room .hum { animation: none; }
  }

  main { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 40px 16px 64px; }
  .mark {
    margin: 0 0 max(40px, calc(42vh - 70px));
    font-size: 14px; font-weight: 500; letter-spacing: .25em;
    color: rgba(59, 50, 20, .45);
    text-align: center;
  }
  .grid {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 16px;
  }
  .grid li { flex: 1 1 160px; min-width: 0; max-width: 220px; }
  .card {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding: 6px 4px 8px;
    color: inherit; text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .card:focus-visible { outline: 1px dashed rgba(59, 50, 20, .5); outline-offset: 2px; }

  /* each app is an abstract bee: its name is the body, banded dark and amber like
     a bee, with glassy wings beating at its sides. It drifts slowly around its spot
     and rocks a little. All motion is transform-only. */
  .wander { display: inline-block; animation: wander var(--wd, 7s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
  .bee {
    position: relative; display: inline-flex; align-items: center; gap: 2px;
    animation: hover 2.6s ease-in-out infinite; animation-delay: var(--delay, 0s);
  }
  .card:hover .bee, .card:focus-visible .bee { animation-duration: 1.2s; }
  .name {
    margin: 0; font: inherit; font-size: 17px; font-weight: 800; letter-spacing: 0; line-height: 1.2;
    white-space: nowrap;
    background: repeating-linear-gradient(90deg, #231904 0 1ch, #8a5f00 1ch 2ch);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 1.5px rgba(255, 249, 222, .95)) drop-shadow(0 0 5px rgba(255, 246, 205, .55)) drop-shadow(0 3px 3px rgba(50, 36, 4, .3));
  }
  .wing { position: relative; flex: none; width: 24px; height: 32px; animation: flap-l .11s ease-in-out infinite alternate; transform-origin: 100% 45%; }
  .wing.r { animation-name: flap-r; transform-origin: 0 45%; animation-delay: -.05s; }
  .wing::before, .wing::after {
    content: ""; position: absolute; border-radius: 50%;
    background: linear-gradient(160deg, rgba(255, 255, 252, .7), rgba(236, 242, 232, .22) 70%);
    border: 1px solid rgba(255, 255, 248, .8);
    box-shadow: 0 0 0 .6px rgba(55, 42, 8, .4), 0 1px 3px rgba(55, 42, 8, .2);
  }
  .wing::before { width: 24px; height: 16px; top: 0; }
  .wing::after { width: 17px; height: 11px; top: 16px; }
  .wing.l::before { right: 0; transform: rotate(18deg); }
  .wing.l::after { right: 1px; transform: rotate(-16deg); }
  .wing.r::before { left: 0; transform: rotate(-18deg); }
  .wing.r::after { left: 1px; transform: rotate(16deg); }
  @keyframes flap-l { from { transform: rotate(14deg) scaleY(1); } to { transform: rotate(-10deg) scaleY(.55); } }
  @keyframes flap-r { from { transform: rotate(-14deg) scaleY(1); } to { transform: rotate(10deg) scaleY(.55); } }
  @keyframes hover {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-2px) rotate(1.5deg); }
  }
  @keyframes wander {
    0%, 100% { transform: translate(-6px, -2px); }
    25% { transform: translate(4px, 3px); }
    50% { transform: translate(-2px, 5px); }
    75% { transform: translate(6px, -3px); }
  }
  .owner {
    align-self: flex-end; margin: 4px 8px 0 0;
    font-size: 11px; color: rgba(46, 37, 10, .6);
    text-shadow: 0 0 5px rgba(255, 248, 214, .5);
    opacity: 0; transform: translateY(-2px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .card:hover .owner, .card:focus-visible .owner { opacity: 1; transform: none; }
  @media (max-width: 420px) {
    .grid { gap: 8px; }
    .name { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wander, .bee, .wing { animation: none; }
    .owner { transition: none; }
  }
</style>
</head>
<body>
<div class="room" aria-hidden="true">
  <canvas id="room"></canvas>
  <div class="hum"></div>
</div>
<main>
  <p class="mark">the beez rooms</p>
  <ul class="grid" id="apps"></ul>
</main>
<div class="film" aria-hidden="true">
  <div class="grain"></div>
  <div class="falloff"></div>
</div>

<script>
  // To add an app: add an entry here. `owner` shows under its bee on hover/focus.
  const APPS = [
    { name: "Apartment Designer", url: "https://isebelle.github.io/rino21111.github.io/", owner: "Isebelle" },
    { name: "progressions", url: "/progressions/", owner: "rino21111" },
    { name: "chrono trader", url: "/chrono_trader/", owner: "rino21111" },
  ];

  const grid = document.getElementById("apps");
  APPS.forEach((app, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<a class="card"><span class="wander"><span class="bee">
        <span class="wing l"></span><h2 class="name"></h2><span class="wing r"></span>
      </span></span><span class="owner"></span></a>`;
    li.querySelector("a").href = app.url;
    li.querySelector(".name").textContent = app.name;
    li.querySelector(".owner").textContent = app.owner;
    const wander = li.querySelector(".wander"), bee = li.querySelector(".bee");
    wander.style.setProperty("--delay", `${-1.37 * i}s`);
    wander.style.setProperty("--wd", `${6.5 + 1.1 * (i % 4)}s`);
    bee.style.setProperty("--delay", `${-0.9 * i}s`);
    grid.append(li);
  });
</script>

<script>
/* Level 0, ray-traced once into the canvas behind everything (and again on resize).
   A grid of drywall with doorways, drop-ceiling tiles, fluorescent troffers with
   occluded soft light, damp carpet, haze, bloom and sensor noise. No network. */
(() => {
  "use strict";
  const cvs = document.getElementById("room");
  const ctx = cvs.getContext("2d", { alpha: false });

  // ---------------- small helpers ----------------
  const sat = v => (v < 0 ? 0 : v > 1 ? 1 : v);
  const sstep = (a, b, v) => { v = sat((v - a) / (b - a)); return v * v * (3 - 2 * v); };
  function hash(x, y) {
    let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul((y | 0) + 0x9e3779b9, 0x165667b1);
    h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function noise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    let fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  // fractal noise; octaves finer than the pixel footprint `fp` fade to their mean
  function fbm(x, y, oct, fp) {
    let s = 0, a = 0.5, f = 1, n = 0;
    for (let i = 0; i < oct; i++) {
      const k = sat(1.5 - fp * f * 2);
      s += a * (k * noise(x * f + i * 31.7, y * f - i * 17.3) + (1 - k) * 0.5);
      n += a; a *= 0.5; f *= 2.03;
    }
    return s / n;
  }
  // box-filtered coverage of a line of half-width hw at signed distance d, footprint fp
  function cover(d, hw, fp) {
    const a = Math.max(d - fp * 0.5, -hw), b = Math.min(d + fp * 0.5, hw);
    return b > a ? (b - a) / fp : 0;
  }
  // the same for lines repeating every P
  function lines(x, P, hw, fp) {
    const avg = (2 * hw) / P;
    if (fp >= P) return avg;
    const c = cover(x - Math.round(x / P) * P, hw, fp);
    const k = (fp / P) * (fp / P);
    return c * (1 - k) + avg * k;
  }

  // ---------------- the floor plan ----------------
  const C = 0.25, MW = 240, MD = 240, OX = 120, OZ = 48;    // cells are 25cm; world x = (cell - OX) * C
  const HC = 2.62, DT = 2.1, EYE = 1.5;                       // ceiling, doorway head, camera height
  const grid = new Uint8Array(MW * MD);                      // 0 open, 1 wall, 2 doorway (wall above DT)
  let seed = 20211;
  const rng = () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const set = (cx, cz, v) => { if (cx >= 0 && cz >= 0 && cx < MW && cz < MD) grid[cz * MW + cx] = v; };
  const cellOf = (w, o) => Math.round(w / C) + o;
  const run = (vert, line, a, b, v) => { for (let k = a; k <= b; k++) vert ? set(line, k, v) : set(k, line, v); };

  function edge(vert, line, a, b, type) {
    if (type === 0) return;                              // nothing
    run(vert, line, a, b, 1);
    if (type === 2) {                                    // a doorway
      const w = 4 + (rng() < 0.35 ? 1 : 0);
      const lo = a + 3, hi = b - 3 - w;
      if (hi >= lo) { const s = lo + Math.floor(rng() * (hi - lo + 1)); run(vert, line, s, s + w - 1, 2); }
    } else if (type === 3) {                             // a stub: wall that just stops
      const L = Math.round((b - a) * (0.3 + rng() * 0.35));
      if (rng() < 0.5) run(vert, line, a + L, b, 0); else run(vert, line, a, b - L, 0);
    } else if (type === 4) {                             // a wide opening, full height
      const w = 6 + Math.floor(rng() * 5), lo = a + 2, hi = b - 2 - w;
      if (hi >= lo) { const s = lo + Math.floor(rng() * (hi - lo + 1)); run(vert, line, s, s + w - 1, 0); }
    }
  }
  const pick = () => { const r = rng(); return r < 0.2 ? 0 : r < 0.38 ? 1 : r < 0.72 ? 2 : r < 0.88 ? 3 : 4; };

  const XL = [], ZL = [];
  for (let x = -3.5; x > -29; x -= 3.9 + rng() * 2.1) XL.unshift(cellOf(x, OX));
  for (let x = 1.75; x < 29; x += 3.9 + rng() * 2.1) XL.push(cellOf(x, OX));
  for (let z = -2.5; z > -11; z -= 4 + rng() * 2) ZL.unshift(cellOf(z, OZ));
  for (let z = 5.0; z < 46; z += 3.9 + rng() * 2.1) ZL.push(cellOf(z, OZ));
  const xi0 = XL.indexOf(cellOf(-3.5, OX)), zi0 = ZL.indexOf(cellOf(5.0, OZ));
  const over = {                                         // hand-placed walls around the camera
    [`v${xi0},${zi0 - 1}`]: 2,     // left of camera: a doorway
    [`v${xi0 + 1},${zi0 - 1}`]: 0, // right of camera: open into the next room
    [`h${xi0 + 1},${zi0 - 1}`]: 1,
    [`h${xi0},${zi0}`]: 2,         // ahead: a doorway
    [`h${xi0 + 1},${zi0}`]: 1,
    [`h${xi0},${zi0 - 1}`]: 1,     // behind
  };
  for (let i = 0; i < XL.length; i++) for (let j = 0; j + 1 < ZL.length; j++) {
    const k = `v${i},${j}`, t = pick();
    edge(true, XL[i], ZL[j], ZL[j + 1], k in over ? over[k] : t);
  }
  for (let j = 0; j < ZL.length; j++) for (let i = 0; i + 1 < XL.length; i++) {
    const k = `h${i},${j}`, t = pick();
    edge(false, ZL[j], XL[i], XL[i + 1], k in over ? over[k] : t);
  }
  // the near field is laid out by hand so the first view has depth
  const box = (x0, z0, x1, z1, v) => {
    for (let cz = cellOf(z0, OZ); cz <= cellOf(z1, OZ); cz++) for (let cx = cellOf(x0, OX); cx <= cellOf(x1, OX); cx++) set(cx, cz, v);
  };
  box(-3.25, -2.25, 9.5, 13.25, 0);
  box(-3.5, -2.5, -3.5, 5.0, 1);          // left wall
  box(-3.5, -2.5, 9.5, -2.5, 1);          // behind
  box(-3.5, 5.0, 1.2, 5.0, 1);            // ahead, with a doorway, stopping short on the right
  box(-1.3, 5.0, -0.3, 5.0, 2);
  box(1.2, 5.0, 1.2, 7.6, 1);             // ...and turning away
  box(-3.5, 10.5, 9.5, 10.5, 1);          // the far wall, two doorways
  box(2.5, 10.5, 3.5, 10.5, 2);
  box(-1.5, 10.5, -0.5, 10.5, 2);
  box(5.75, 10.5, 6.75, 10.5, 2);
  box(-3.5, 5.0, -3.5, 13.5, 1);
  box(7.0, 3.0, 7.0, 10.5, 1);            // right side wall, a doorway through it
  box(7.0, 6.2, 7.0, 7.2, 2);
  box(-3.5, 13.5, 9.5, 13.5, 1);
  box(-1.0, 13.5, 0.0, 13.5, 2);
  box(-3.5, 7.75, -1.75, 7.75, 1);        // a short partition behind the first doorway
  const cellAt = (cx, cz) => (cx < 0 || cz < 0 || cx >= MW || cz >= MD ? 1 : grid[cz * MW + cx]);

  // ---------------- the lights: 2x4 troffers on a 2.4m lattice ----------------
  const LS = 2.4, LZ0 = 1.2, LI0 = -12, LJ0 = -4, LN = 25, LM = 22;
  const lampI = new Float32Array(LN * LM), lampG = new Float32Array(LN * LM), lampP = new Uint8Array(LN * LM);
  for (let i = 0; i < LN; i++) for (let j = 0; j < LM; j++) {
    const lx = (i + LI0) * LS, lz = LZ0 + (j + LJ0) * LS;
    let ok = true;
    for (let x = lx - 0.25; x <= lx + 0.25 && ok; x += 0.25)
      for (let z = lz - 0.25; z <= lz + 0.25 && ok; z += 0.25)
        if (cellAt(Math.floor(x / C + OX), Math.floor(z / C + OZ))) ok = false;
    if (!ok) continue;
    lampP[i * LM + j] = 1;
    const r = hash(i * 7 + 3, j * 13 + 5);
    lampI[i * LM + j] = r < 0.06 || (i === 11 && j === 5) ? 0 : (0.9 + 0.2 * hash(i, j)) * (r < 0.1 ? 0.45 : 1);
    lampG[i * LM + j] = hash(j + 11, i + 29) - 0.5;
  }

  // 2D line of sight in the plan, from (ax,ay,az) up to a lamp at (bx,by,bz)
  function los(ax, ay, az, bx, by, bz) {
    const gx0 = ax / C + OX, gz0 = az / C + OZ, gx1 = bx / C + OX, gz1 = bz / C + OZ;
    let cx = Math.floor(gx0), cz = Math.floor(gz0);
    const ddx = gx1 - gx0, ddz = gz1 - gz0;
    const sx = ddx > 0 ? 1 : -1, sz = ddz > 0 ? 1 : -1;
    const tdx = ddx !== 0 ? Math.abs(1 / ddx) : 1e30, tdz = ddz !== 0 ? Math.abs(1 / ddz) : 1e30;
    let tmx = ddx > 0 ? (cx + 1 - gx0) * tdx : (gx0 - cx) * tdx;
    let tmz = ddz > 0 ? (cz + 1 - gz0) * tdz : (gz0 - cz) * tdz;
    let n = Math.abs(Math.floor(gx1) - cx) + Math.abs(Math.floor(gz1) - cz);
    const dy = by - ay;
    while (n-- > 0) {
      let s;
      if (tmx < tmz) { s = tmx; cx += sx; tmx += tdx; } else { s = tmz; cz += sz; tmz += tdz; }
      const v = grid[cz * MW + cx];
      if (v === 1) return false;
      if (v === 2) {
        const se = tmx < tmz ? tmx : tmz;
        if (ay + dy * s > DT || ay + dy * (se > 1 ? 1 : se) > DT) return false;
      }
    }
    return true;
  }

  // ---------------- light on the carpet, with real shadows (precomputed per cell) ----------------
  const lm = new Float32Array(MW * MD), lmb = new Float32Array(MW * MD);
  const LR = 6.2, H2 = HC * HC;
  function bakeRow(cz) {
    for (let cx = 20; cx < MW - 20; cx++) {
      if (grid[cz * MW + cx]) continue;
      const x = (cx + 0.5 - OX) * C, z = (cz + 0.5 - OZ) * C;
      let E = 0;
      const i0 = Math.max(0, Math.ceil((x - LR) / LS) - LI0), i1 = Math.min(LN - 1, Math.floor((x + LR) / LS) - LI0);
      const j0 = Math.max(0, Math.ceil((z - LR - LZ0) / LS) - LJ0), j1 = Math.min(LM - 1, Math.floor((z + LR - LZ0) / LS) - LJ0);
      for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
        const I = lampI[i * LM + j];
        if (!I) continue;
        const lx = (i + LI0) * LS, lzc = LZ0 + (j + LJ0) * LS;
        for (let s = -1; s <= 1; s += 2) {
          const lz = lzc + 0.3 * s, ddx = lx - x, ddz = lz - z, h2 = ddx * ddx + ddz * ddz;
          if (h2 > LR * LR) continue;
          const d2 = h2 + H2, w = 0.5 * I * H2 * H2 / (d2 * d2);
          if (w > 0.004 && los(x, 0, z, lx, HC, lz)) E += w;
        }
      }
      lm[cz * MW + cx] = E;
    }
  }
  function finishLightmap() {
    // walls take the mean of their open neighbours so sampling near them doesn't sink to black
    for (let pass = 0; pass < 2; pass++) for (let cz = 1; cz < MD - 1; cz++) for (let cx = 1; cx < MW - 1; cx++) {
      const k = cz * MW + cx;
      if (!grid[k] || lm[k]) continue;
      let s = 0, n = 0;
      for (const o of [1, -1, MW, -MW]) { const v = lm[k + o]; if (v) { s += v; n++; } }
      if (n) lm[k] = s / n;
    }
    // a wide blur of it stands in for the light bouncing around
    lmb.set(lm);
    const tmp = new Float32Array(MW * MD), R = 4;
    for (let it = 0; it < 2; it++) {
      for (let cz = 0; cz < MD; cz++) { let acc = 0; const row = cz * MW;
        for (let cx = -R; cx < MW; cx++) {
          if (cx + R < MW) acc += lmb[row + cx + R];
          if (cx - R - 1 >= 0) acc -= lmb[row + cx - R - 1];
          if (cx >= 0) tmp[row + cx] = acc / (2 * R + 1);
        } }
      for (let cx = 0; cx < MW; cx++) { let acc = 0;
        for (let cz = -R; cz < MD; cz++) {
          if (cz + R < MD) acc += tmp[(cz + R) * MW + cx];
          if (cz - R - 1 >= 0) acc -= tmp[(cz - R - 1) * MW + cx];
          if (cz >= 0) lmb[cz * MW + cx] = acc / (2 * R + 1);
        } }
    }
  }
  function sample(arr, x, z) {
    const gx = x / C + OX - 0.5, gz = z / C + OZ - 0.5;
    const ix = Math.floor(gx), iz = Math.floor(gz), fx = gx - ix, fz = gz - iz;
    if (ix < 0 || iz < 0 || ix >= MW - 1 || iz >= MD - 1) return 0;
    const k = iz * MW + ix;
    return (arr[k] * (1 - fx) + arr[k + 1] * fx) * (1 - fz) + (arr[k + MW] * (1 - fx) + arr[k + MW + 1] * fx) * fz;
  }
  // distance from a floor/ceiling point to the nearest wall face (for corner darkening)
  function wallDist(x, z) {
    const gx = x / C + OX, gz = z / C + OZ, cx = Math.floor(gx), cz = Math.floor(gz);
    let best = 0.6;
    for (let oz = -2; oz <= 2; oz++) for (let ox = -2; ox <= 2; ox++) {
      if (!cellAt(cx + ox, cz + oz)) continue;
      const qx = Math.max(cx + ox - gx, 0, gx - (cx + ox + 1)), qz = Math.max(cz + oz - gz, 0, gz - (cz + oz + 1));
      const d = Math.sqrt(qx * qx + qz * qz) * C;
      if (d < best) best = d;
    }
    return best;
  }

  // ---------------- the camera and the tracer ----------------

      for (let px = 0; px < W; px++) {
        const bx = Math.min(bw - 1.001, Math.max(0, (px + 0.5) / 4 - 0.5)), ix = Math.floor(bx), fx = bx - ix;
        const o = (py * W + px) * 3, q = (iy * bw + ix) * 3, q2 = q + bw * 3;
        const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
        const n = rnd() - 0.5, nc = rnd() - 0.5;
        const cax = (px - W * 0.5) * 0.0011, cay = (py - H * 0.5) * 0.0011;   // a cheap lens: colour fringes toward the corners
        for (let c = 0; c < 3; c++) {
          const nb = near[q + c] * w00 + near[q + 3 + c] * w10 + near[q2 + c] * w01 + near[q2 + 3 + c] * w11;
          const wb = wide[q + c] * w00 + wide[q + 3 + c] * w10 + wide[q2 + c] * w01 + wide[q2 + 3 + c] * w11;
          const glow = (nb * 0.22 + wb * 0.3) * EXPO * 0.5;
          let v = c === 1 ? ldr[o + 1] : samp(px + (c === 0 ? cax : -cax), py + (c === 0 ? cay : -cay), c);
          v = 1 - (1 - v) * (1 - Math.min(glow, 1));          // screen the glow on
          v = Math.pow(v, 1 / 2.2);                            // to display
          v = v * 0.75 + 0.25 * v * v * (3 - 2 * v);           // a little film contrast
          v = 0.03 + v * 0.95;                                 // lifted blacks, like a cheap sensor
          v *= c === 0 ? 1.02 : c === 1 ? 0.99 : 0.95;     // the sodium-ish warmth of old film
          v += (n * 0.035 + (c === 1 ? nc : -nc) * 0.012) * (1.2 - v);
          d[(py * W + px) * 4 + c] = v * 255 + 0.5;
        }
        d[(py * W + px) * 4 + 3] = 255;
      }
      if (py % 64 === 63) yield;
    }
    if (myJob !== job) return;
    cvs.width = W; cvs.height = H;
    ctx.putImageData(img, 0, 0);
    cvs.classList.add("on");
    hdr = ldr = null;
  }

  function start() {
    const myJob = ++job;
    const it = render(myJob);
    const step = () => {
      if (myJob !== job) return;
      const until = performance.now() + 14;
      while (performance.now() < until) { if (it.next().done) return; }
      setTimeout(step, 0);
    };
    step();
  }

  // film grain tile for the overlay
  (() => {
    const g = document.createElement("canvas"); g.width = g.height = 192;
    const gc = g.getContext("2d"), id = gc.createImageData(192, 192);
    for (let i = 0; i < id.data.length; i += 4) {
      const v = 128 + (Math.random() + Math.random() + Math.random() - 1.5) * 70;
      id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
    }
    gc.putImageData(id, 0, 0);
    document.querySelector(".film .grain").style.backgroundImage = `url(${g.toDataURL()})`;
  })();

  start();
  let lastW = 0, lastH = 0, rt = 0;
  lastW = innerWidth; lastH = innerHeight;
  addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      // phones resize a little as their toolbars slide; only redraw for real changes
      if (Math.abs(innerWidth - lastW) < 2 && Math.abs(innerHeight - lastH) < lastH * 0.15) return;
      lastW = innerWidth; lastH = innerHeight;
      start();
    }, 250);
  });
})();
</script>
</body>
</html>
